name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs for the same ref so only the latest commit is validated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The integration suite talks to a real SQL Server and a real Azurite, the
    # same dependencies docker-compose.yml provides locally. SqlServerTestDatabase
    # creates a uniquely named database per fixture, applies migrations, and drops
    # it afterwards, so a fresh empty server is all CI has to supply. The image,
    # credentials, and ports below must stay in step with docker-compose.yml — the
    # test connection strings hardcode localhost:1433 and the Azurite defaults.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "LocalDev!Passw0rd"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalDev!Passw0rd' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Azurite runs as an explicit container rather than a service container:
      # it binds to 127.0.0.1 inside the container by default, so it needs the
      # same --blobHost/--queueHost/--tableHost override docker-compose.yml uses
      # to be reachable through the published ports. Service containers cannot
      # override the image command.
      - name: Start Azurite
        run: |
          docker run -d --name azurite \
            -p 10000:10000 -p 10001:10001 -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0

      - name: Wait for Azurite
        run: |
          for i in $(seq 1 30); do
            if curl --silent --output /dev/null --max-time 2 http://127.0.0.1:10000/devstoreaccount1; then
              echo "Azurite is accepting connections."
              exit 0
            fi
            sleep 2
          done
          echo "Azurite did not become reachable in time." >&2
          docker logs azurite >&2 || true
          exit 1

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors=false keeps compiler warnings informational; the job
      # fails only on build errors or test failures. (MSBuild rejects the
      # /warnaserror- switch form on Linux runners.)
      - name: Build
        run: dotnet build --no-restore -p:TreatWarningsAsErrors=false

      - name: Test
        # trx files are auto-named so each test project keeps its own results file.
        run: dotnet test --no-build --verbosity normal --logger trx --results-directory TestResults

      - name: Test summary
        if: always()
        run: |
          {
            echo "### Backend test results"
            echo '```'
            grep -rho '<Counters [^>]*/>' TestResults || echo "No test results found"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npx ng test --watch=false

      # Formatting is a placeholder check for now: it runs only when a Prettier
      # config exists, and it is advisory (continue-on-error) because several
      # scaffold files predate the check and are not yet Prettier-clean. Make it
      # blocking once the scaffold is reformatted in a dedicated change.
      - name: Check formatting
        continue-on-error: true
        run: |
          if [ -f .prettierrc ]; then
            npx prettier --check "src/**/*.{ts,html,css}"
          else
            echo "No Prettier config found; skipping formatting check."
          fi
