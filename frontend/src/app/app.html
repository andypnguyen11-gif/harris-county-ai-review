<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="app-header">
  <div class="app-header__inner">
    <a class="app-header__brand" routerLink="/">
      <span class="app-header__seal" aria-hidden="true">HC</span>
      <span class="app-header__brand-text">
        <span class="app-header__brand-title">Harris County AI Document Review</span>
        <span class="app-header__brand-subtitle">Permit Application Review Assistant</span>
      </span>
    </a>
    <nav class="app-nav" aria-label="Primary">
      <a
        class="app-nav__link"
        routerLink="/"
        routerLinkActive="app-nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Dashboard</a
      >
      <a class="app-nav__link" routerLink="/cases" routerLinkActive="app-nav__link--active"
        >Cases</a
      >
    </nav>
  </div>
</header>

<main class="app-main" id="main-content">
  <router-outlet />
</main>

<footer class="app-footer">
  <div class="app-footer__inner">
    <p>Harris County AI Document Review Assistant — internal use only.</p>
    <p>&copy; {{ currentYear }} Harris County</p>
  </div>
</footer>
